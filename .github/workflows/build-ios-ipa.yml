name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "Feat/IPA-Fresh-files", "main" ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned Release app
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package FreshCart.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 2 | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r FreshCart.ipa Payload

      - name: Upload FreshCart.ipa
        uses: actions/upload-artifact@v4
        with:
          name: FreshCart-iOS-IPA
          path: FreshCart.ipa
